<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<title>Controle Financeiro</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:rgba(255,255,255,0.07);--green:#22c55e;--red:#ef4444;--text:#e8eaf0;--muted:#6b7280;--muted2:#374151;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;color:var(--text);}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:13px 16px;display:flex;justify-content:space-between;align-items:center;}
.header h1{font-size:19px;font-weight:700;color:var(--text);}
.header h1 span{color:var(--green);}
.header-right{display:flex;align-items:center;gap:8px;}
.btn-eye-global{background:none;border:none;cursor:pointer;font-size:18px;color:var(--muted);padding:4px;}
.btn-icon{background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:6px 11px;font-size:12px;cursor:pointer;transition:all .2s;}
.btn-icon:hover{color:var(--text);border-color:var(--green);}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted2);flex-shrink:0;transition:background .3s;}
.sync-dot.ok{background:var(--green);}
.sync-dot.syncing{background:#fbbf24;animation:pulse .8s infinite;}
.sync-dot.err{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;}
.tab-button{flex:1;min-width:70px;padding:11px 6px;border:none;background:none;cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;}
.tab-button.active{color:var(--green);border-bottom-color:var(--green);}
.month-bar{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 8px;height:48px;gap:4px;}
.month-nav{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);padding:5px 9px;border-radius:7px;line-height:1;flex-shrink:0;transition:all .15s;}
.month-nav:hover{background:var(--surface2);color:var(--green);}
.month-label{font-size:15px;font-weight:700;color:var(--text);text-align:center;flex:1;user-select:none;}
.year-selector{display:flex;align-items:center;gap:3px;flex-shrink:0;}
.year-nav{background:none;border:none;font-size:14px;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px;}
.year-nav:hover{color:var(--green);}
.year-label{font-size:13px;font-weight:600;color:var(--muted);min-width:36px;text-align:center;}
.tab-content{display:none;flex:1;padding:13px;flex-direction:column;gap:10px;overflow-y:auto;}
.tab-content.active{display:flex;}
.summary-top{display:flex;gap:7px;}
.mini-card{flex:1;border-radius:10px;padding:11px 13px;border:1px solid var(--border);}
.mini-card .label{font-size:9px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;font-weight:600;}
.mini-card .value{font-size:15px;font-weight:700;}
.card-gasto{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.2);}
.card-gasto .label{color:#f87171;}.card-gasto .value{color:var(--red);}
.card-entrada{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.2);}
.card-entrada .label{color:#4ade80;}.card-entrada .value{color:var(--green);}
.card-saldo{background:var(--surface2);border-color:var(--border);}
.card-saldo .label{color:var(--muted);}.card-saldo .value{color:var(--text);}
.card-saldo.positivo{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.3);}.card-saldo.positivo .value{color:var(--green);}
.card-saldo.negativo{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);}.card-saldo.negativo .value{color:var(--red);}
.category-list{display:flex;flex-direction:column;gap:5px;}
.category-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.category-item.cat-force-show{opacity:.45;}
.category-header{display:flex;align-items:center;padding:12px 13px;cursor:pointer;user-select:none;transition:background .15s;gap:9px;}
.category-header:hover{background:var(--surface2);}
.cat-emoji{font-size:17px;flex-shrink:0;}
.cat-name{flex:1;font-size:14px;font-weight:500;color:var(--text);}
.cat-total{font-size:14px;font-weight:600;color:#94a3b8;}
.cat-total.zero{color:var(--muted2);font-weight:400;font-size:13px;}
.cat-chevron{font-size:10px;color:var(--muted);transition:transform .2s;flex-shrink:0;}
.category-item.open .cat-chevron{transform:rotate(180deg);color:var(--green);}
.btn-eye-cat{background:none;border:none;cursor:pointer;font-size:14px;padding:2px 4px;color:var(--muted2);transition:all .15s;flex-shrink:0;}
.btn-eye-cat.is-hidden{color:var(--green);}
.category-details{display:none;border-top:1px solid var(--border);padding:4px 13px 11px;background:var(--bg);}
.category-item.open .category-details{display:block;}
.subcategory-section{margin-top:9px;}
.subcategory-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;padding-bottom:3px;border-bottom:1px solid var(--border);}
.expense-entry{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);gap:7px;}
.expense-entry:last-of-type{border-bottom:none;}
.entry-date{font-size:12px;color:var(--muted);min-width:38px;flex-shrink:0;}
.entry-desc{font-size:12px;color:var(--muted);flex:1;font-style:italic;}
.entry-parcela{font-size:10px;color:#a78bfa;font-weight:600;flex-shrink:0;}
.entry-type{font-size:10px;padding:2px 6px;border-radius:4px;flex-shrink:0;font-weight:600;}
.type-card{background:rgba(34,197,94,.15);color:#4ade80;}
.type-debit{background:rgba(251,191,36,.15);color:#fbbf24;}
.entry-value{font-size:14px;font-weight:600;color:#94a3b8;flex-shrink:0;}
.btn-del{background:none;border:none;color:var(--muted2);cursor:pointer;font-size:13px;padding:2px 4px;transition:color .15s;}
.btn-del:hover{color:var(--red);}
.btn-edit-entry{background:none;border:none;color:var(--muted2);cursor:pointer;font-size:12px;padding:2px 4px;transition:color .15s;}
.btn-edit-entry:hover{color:#60a5fa;}
.sub-total-row{display:flex;justify-content:space-between;padding:6px 0 2px;font-size:12px;color:#64748b;font-weight:600;border-top:1px dashed var(--border);margin-top:3px;}
.empty-cat{font-size:12px;color:var(--muted2);padding:9px 0;text-align:center;}
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:13px;}
.form-card h2{font-size:15px;font-weight:700;color:var(--text);}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.field input,.field select{padding:10px 11px;border:1.5px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit;color:var(--text);background:var(--bg);transition:border-color .2s;}
.field input::placeholder{color:var(--muted2);}
.field input:focus,.field select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.1);}
.field select option{background:var(--surface);color:var(--text);}
.field-row{display:flex;gap:9px;}
.field-row .field{flex:1;}
.btn-add{background:var(--green);color:#0f1117;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-add:hover{background:#16a34a;}
.btn-add.entrada-btn{background:#3b82f6;color:white;}
.income-section{display:flex;flex-direction:column;gap:6px;}
.income-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.income-item-header{display:flex;align-items:center;padding:12px 13px;cursor:pointer;gap:9px;transition:background .15s;}
.income-item-header:hover{background:var(--surface2);}
.income-emoji{font-size:17px;flex-shrink:0;}
.income-name{flex:1;font-size:14px;font-weight:500;color:var(--text);}
.income-total{font-size:14px;font-weight:700;color:var(--green);}
.income-chevron{font-size:10px;color:var(--muted);transition:transform .2s;}
.income-item.open .income-chevron{transform:rotate(180deg);color:var(--green);}
.income-details{display:none;border-top:1px solid var(--border);padding:4px 13px 11px;background:var(--bg);}
.income-item.open .income-details{display:block;}
.income-entry{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);gap:7px;}
.income-entry:last-of-type{border-bottom:none;}
.income-entry-date{font-size:12px;color:var(--muted);min-width:38px;}
.income-entry-desc{font-size:12px;color:var(--muted);flex:1;font-style:italic;}
.income-entry-value{font-size:14px;font-weight:600;color:var(--green);}
.annual-controls{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 13px;}
.annual-controls span{font-size:15px;font-weight:700;color:var(--text);}
.annual-nav{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:4px 9px;border-radius:6px;transition:all .15s;}
.annual-nav:hover{color:var(--green);background:var(--surface2);}
.annual-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);}
.annual-table{width:100%;border-collapse:collapse;font-size:12px;min-width:520px;}
.annual-table th{background:var(--surface2);color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:8px 7px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}
.annual-table th:first-child{text-align:left;position:sticky;left:0;background:var(--surface2);z-index:2;}
.annual-table td{padding:8px 7px;border-bottom:1px solid var(--border);text-align:right;color:var(--muted);white-space:nowrap;}
.annual-table td:first-child{text-align:left;color:var(--text);font-weight:500;position:sticky;left:0;background:var(--surface);z-index:1;}
.annual-table tr:hover td{background:var(--surface2);}
.annual-table tr:hover td:first-child{background:var(--surface2);}
.annual-table td.has-val{color:var(--red);font-weight:600;}
.annual-table td.inc-val{color:var(--green);font-weight:600;}
.annual-table tr.tot-row td{border-top:2px solid var(--border);background:var(--surface2);font-weight:700;color:var(--text);}
.annual-table tr.tot-row td:first-child{background:var(--surface2);}
.annual-table tr.div-row td{background:var(--surface2);color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:5px 7px;}
.annual-table tr.saldo-row td.pos{color:var(--green);font-weight:700;}
.annual-table tr.saldo-row td.neg{color:var(--red);font-weight:700;}
.btn-manage-hidden{background:none;border:1px dashed var(--muted2);border-radius:8px;color:var(--muted);font-size:12px;padding:10px;cursor:pointer;transition:all .2s;width:100%;margin-top:2px;}
.btn-manage-hidden:hover{border-color:var(--green);color:var(--green);}
/* GAS TOGGLE */
.gas-toggle{display:flex;gap:8px;margin-top:0;}
.gas-btn{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;}
.gas-btn.active{border-color:var(--green);color:var(--green);background:rgba(34,197,94,.08);}
/* ENTRY CARD — layout melhorado para livre/weed/outros */
.entry-card{background:var(--surface2);border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;flex-direction:column;gap:5px;}
.entry-card:last-of-type{margin-bottom:0;}
.entry-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.entry-card-name{font-size:13px;font-weight:600;color:var(--text);flex:1;}
.entry-card-value{font-size:15px;font-weight:700;color:#94a3b8;}
.entry-card-bottom{display:flex;align-items:center;gap:6px;}
.entry-card-date{font-size:11px;color:var(--muted);}
.entry-card-parcela{font-size:10px;color:#a78bfa;font-weight:700;padding:1px 6px;border-radius:4px;background:rgba(167,139,250,.15);}
.entry-card-type{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;}
.entry-card-actions{display:flex;gap:4px;margin-left:auto;}
.entry-card-extra{font-size:11px;color:var(--muted);}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:flex-end;justify-content:center;}
.modal.active{display:flex;}
.modal-inner{background:var(--surface);border:1px solid var(--border);padding:22px;border-radius:12px;max-width:360px;width:90%;margin-bottom:40px;}
.modal-title{font-size:15px;font-weight:700;margin-bottom:13px;color:var(--text);}
.modal-btns{display:flex;gap:9px;justify-content:flex-end;margin-top:16px;}
.modal-btns button{padding:8px 17px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;}
.btn-cancel{background:var(--surface2);color:var(--muted);}
.btn-confirm{background:var(--green);color:#0f1117;}
.modal-inner input[type=file]{color:var(--muted);font-size:13px;}
.sheet-modal{background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--green);padding:18px;border-radius:16px 16px 0 0;width:100%;max-width:600px;position:fixed;bottom:0;left:50%;transform:translateX(-50%);box-shadow:0 -8px 40px rgba(0,0,0,.4);max-height:90vh;overflow-y:auto;}
.sheet-title{font-size:14px;font-weight:700;color:var(--green);margin-bottom:14px;text-align:center;}
.sheet-fields{display:flex;flex-direction:column;gap:11px;}
.sheet-row{display:flex;gap:9px;}
.sheet-row .field{flex:1;}
.sheet-actions{display:flex;gap:9px;margin-top:14px;}
.sheet-actions button{flex:1;padding:11px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
.btn-save{background:var(--green);color:#0f1117;}
.btn-cancel-sheet{background:var(--surface2);color:var(--muted);}
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;transition:opacity .3s;}
.loading-screen.done{opacity:0;pointer-events:none;}
.loading-spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:14px;color:var(--muted);}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:3px;}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">Conectando ao banco de dados...</div>
</div>

<div class="header">
  <h1>💰 Meus <span>Gastos</span></h1>
  <div class="header-right">
    <div class="sync-dot" id="syncDot" title="Status de sincronização"></div>
    <button class="btn-icon" onclick="exportData()">⬆ Exportar</button>
    <button class="btn-icon" onclick="openImportModal()">⬇ Importar</button>
  </div>
</div>

<div class="tabs">
  <button class="tab-button active" onclick="switchTab(0)">Resumo</button>
  <button class="tab-button" onclick="switchTab(1)">+ Adicionar</button>
  <button class="tab-button" onclick="switchTab(2)">Entradas</button>
  <button class="tab-button" onclick="switchTab(3)">Anual</button>
</div>

<div class="month-bar">
  <button class="month-nav" onclick="changeMonth(-1)">‹</button>
  <span class="month-label" id="monthLabel"></span>
  <button class="month-nav" onclick="changeMonth(1)">›</button>
  <div class="year-selector">
    <button class="year-nav" onclick="changeYear(-1)">‹</button>
    <span class="year-label" id="yearLabel"></span>
    <button class="year-nav" onclick="changeYear(1)">›</button>
  </div>
  <button class="btn-eye-global" id="btnEyeGlobal" onclick="toggleValuesVisibility()" title="Ocultar valores">👁</button>
</div>

<div class="tab-content active" id="tab-resumo">
  <div class="summary-top">
    <div class="mini-card card-entrada"><div class="label">Entradas</div><div class="value" id="resumoEntrada">—</div></div>
    <div class="mini-card card-gasto"><div class="label">Gastos</div><div class="value" id="resumoGasto">—</div></div>
    <div class="mini-card card-saldo" id="cardSaldo"><div class="label">Saldo</div><div class="value" id="resumoSaldo">—</div></div>
  </div>
  <div class="category-list" id="categoryList"></div>
  <button class="btn-manage-hidden" id="btnManageHidden" onclick="toggleShowHidden()" style="display:none">👁 Gerenciar categorias ocultas</button>
</div>

<div class="tab-content" id="tab-adicionar">
  <div class="form-card">
    <h2>Novo gasto</h2>
    <div class="field"><label>Categoria</label><select id="fCategoria" onchange="onCategoriaChange()"><option value="">Selecione...</option></select></div>
    <div class="field" id="fieldSubcat" style="display:none"><label>Subcategoria</label><select id="fSubcategoria"></select></div>
    <div class="field" id="fieldSubcatLivre" style="display:none"><label>Descrição</label><input type="text" id="fSubcatLivre" placeholder="ex: Gelato, Pão de Açúcar..."></div>
    <div class="field" id="fieldParcela" style="display:none"><label>Parcela (ex: 2/3)</label><input type="text" id="fParcela" placeholder="ex: 1/3"></div>
    <!-- GASOLINA EXTRA -->
    <div id="fieldGasolinaVeiculo" style="display:none">
      <label style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px;">Veículo</label>
      <div class="gas-toggle">
        <button type="button" class="gas-btn active" id="gasMotoBtn" onclick="selectVeiculo('moto')">🏍️ Moto</button>
        <button type="button" class="gas-btn" id="gasCarroBtn" onclick="selectVeiculo('carro')">🚗 Carro</button>
      </div>
      <input type="hidden" id="fGasVeiculo" value="moto">
    </div>
    <div class="field" id="fieldGasolinaLitro" style="display:none">
      <label>Preço por litro (R$)</label>
      <input type="text" id="fGasLitro" placeholder="0,00" inputmode="numeric">
    </div>
    <div class="field-row">
      <div class="field"><label>Data</label><input type="date" id="fData"></div>
      <div class="field"><label>Valor (R$)</label><input type="text" id="fValor" placeholder="0,00" inputmode="numeric"></div>
    </div>
    <div class="field"><label>Tipo</label>
      <select id="fTipo">
        <option value="debit">Débito / Dinheiro</option>
        <option value="card">Cartão de crédito</option>
      </select>
    </div>
    <button class="btn-add" onclick="addExpense()">Adicionar gasto</button>
  </div>
</div>

<div class="tab-content" id="tab-entradas">
  <div class="form-card">
    <h2>Nova entrada</h2>
    <div class="field"><label>Tipo</label>
      <select id="fEntradaTipo" onchange="onEntradaTipoChange()">
        <option value="salario">💼 Salário</option>
        <option value="vale">🎫 Vale</option>
        <option value="outro">➕ Outra entrada</option>
      </select>
    </div>
    <div class="field-row">
      <div class="field"><label>Data</label><input type="date" id="fEntradaData"></div>
      <div class="field"><label>Valor (R$)</label><input type="text" id="fEntradaValor" placeholder="0,00" inputmode="numeric"></div>
    </div>
    <div class="field" id="fieldEntradaDesc" style="display:none"><label>Descrição</label><input type="text" id="fEntradaDesc" placeholder="ex: Freelance, 13º..."></div>
    <button class="btn-add entrada-btn" onclick="addEntrada()">Adicionar entrada</button>
  </div>
  <div class="income-section" id="incomeList"></div>
</div>

<div class="tab-content" id="tab-anual">
  <div class="annual-controls">
    <button class="annual-nav" onclick="changeAnnualYear(-1)">‹</button>
    <span id="annualYearLabel"></span>
    <button class="annual-nav" onclick="changeAnnualYear(1)">›</button>
  </div>
  <div class="annual-wrap"><table class="annual-table" id="annualTable"></table></div>
</div>

<div class="modal" id="editModal">
  <div class="sheet-modal">
    <div class="sheet-title">Editar lançamento</div>
    <div class="sheet-fields">
      <div class="field"><label>Categoria</label><select id="eCat" onchange="onEditCatChange()"><option value="">Selecione...</option></select></div>
      <div class="field" id="eFieldSubcat" style="display:none"><label>Subcategoria</label><select id="eSubcat"></select></div>
      <div class="field" id="eFieldSubcatLivre" style="display:none"><label>Descrição</label><input type="text" id="eSubcatLivre"></div>
      <div class="field" id="eFieldParcela" style="display:none"><label>Parcela</label><input type="text" id="eParcela"></div>
      <div class="sheet-row">

// ── SUPABASE API ──────────────────────────────────────────────────────────────
function sbFetch(path, method, body) {
  return fetch(SB_URL + '/rest/v1/' + path, {
    method: method || 'GET',
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json',
      'Prefer': method === 'POST' ? 'resolution=merge-duplicates' : ''
    },
    body: body ? JSON.stringify(body) : undefined
  }).then(function(r) {
    if (!r.ok) return r.text().then(function(t) { throw new Error(t); });
    return r.text().then(function(t) { return t ? JSON.parse(t) : null; });
  });
}

async function loadFromDB() {
  try {
    var expRows = await sbFetch('expenses?select=id,data&order=id.asc');
    var incRows = await sbFetch('incomes?select=id,data&order=id.asc');
    var setRows = await sbFetch('settings?select=key,data');

    expenses = (expRows || []).map(function(r) { return r.data; });
    incomes  = (incRows || []).map(function(r) { return r.data; });

    var hidRow = (setRows || []).find(function(r) { return r.key === 'hidden_cats'; });
    hiddenCats = hidRow ? hidRow.data : [];

    setSyncDot('ok');
    return true;
  } catch(e) {
    console.error('Erro ao carregar:', e);
    // fallback localStorage
    expenses   = JSON.parse(localStorage.getItem('gastos_v2') || '[]');
    incomes    = JSON.parse(localStorage.getItem('entradas_v2') || '[]');
    hiddenCats = JSON.parse(localStorage.getItem('cats_hidden') || '[]');
    setSyncDot('err');
    return false;
  }
}

async function saveExpenseToDB(exp) {
  return sbFetch('expenses', 'POST', { id: exp.id, data: exp });
}

async function deleteExpenseFromDB(id) {
  return sbFetch('expenses?id=eq.' + id, 'DELETE');
}

async function saveIncomeToDB(inc) {
  return sbFetch('incomes', 'POST', { id: inc.id, data: inc });
}

async function deleteIncomeFromDB(id) {
  return sbFetch('incomes?id=eq.' + id, 'DELETE');
}

async function saveHiddenToDB() {
  return sbFetch('settings', 'POST', { key: 'hidden_cats', data: hiddenCats });
}

function setSyncDot(state) {

function changeMonth(d){currentMonth+=d;if(currentMonth>11){currentMonth=0;currentYear++;}if(currentMonth<0){currentMonth=11;currentYear--;}updateMonthBar();renderResume();renderEntradas();}
function changeYear(d){currentYear+=d;updateMonthBar();renderResume();renderEntradas();}

// ── MÁSCARA ───────────────────────────────────────────────────────────────────
function setupMask(id){
  var el=document.getElementById(id);
  if(!el||el._masked)return;
  el._masked=true;
  el.addEventListener('input',function(){
    var d=this.value.replace(/\D/g,'');
    if(!d){this.value='';return;}
    this.value=(parseInt(d,10)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  });
}
function parseVal(s){if(!s)return 0;return parseFloat(s.replace(/\./g,'').replace(',','.'))||0;}
function fBRL(v){return 'R$ '+v.toFixed(2).replace('.',',');}
function fDate(s){var p=s.split('-');return p[2]+'/'+p[1];}

  setSyncDot('syncing');

}

var _tG=0,_tE=0,_tS=0;
function updateTopCards(){
  document.getElementById('resumoGasto').textContent=maskVal(fBRL(_tG));
  document.getElementById('resumoEntrada').textContent=maskVal(fBRL(_tE));
  document.getElementById('resumoSaldo').textContent=maskVal(fBRL(_tS));
}

// ── RESUMO ────────────────────────────────────────────────────────────────────
function renderResume(){
  var key=monthKey();
  var exp=expenses.filter(function(e){return e.date.startsWith(key);});
  var inc=incomes.filter(function(e){return e.date.startsWith(key);});
  _tG=exp.reduce(function(s,e){return s+e.value;},0);
  _tE=inc.reduce(function(s,e){return s+e.value;},0);
  _tS=_tE-_tG;
  updateTopCards();
  var cs=document.getElementById('cardSaldo');
  cs.className='mini-card card-saldo';
  if(_tS>0)cs.classList.add('positivo');
  if(_tS<0)cs.classList.add('negativo');
  var list=document.getElementById('categoryList');
  list.innerHTML='';
  CATEGORIES.forEach(function(cat){
    var isHidden=hiddenCats.indexOf(cat.id)>=0;
    if(isHidden&&!showingHidden)return;
    var catExp=exp.filter(function(e){return e.categoryId===cat.id;});
    var catTotal=catExp.reduce(function(s,e){return s+e.value;},0);
    var item=document.createElement('div');
    item.className='category-item'+(isHidden?' cat-force-show':'');
    var hdr=document.createElement('div');hdr.className='category-header';
    if(!isHidden)hdr.onclick=function(){item.classList.toggle('open');};
    var eyeBtn='<button class="btn-eye-cat'+(isHidden?' is-hidden':'')+'" onclick="event.stopPropagation();toggleHide(\''+cat.id+'\')" title="'+(isHidden?'Reativar':'Ocultar')+'">👁</button>';
    hdr.innerHTML='<span class="cat-emoji">'+cat.emoji+'</span><span class="cat-name">'+cat.name+'</span><span class="cat-total'+(catTotal===0?' zero':'')+'">'+fBRL(catTotal)+'</span>'+eyeBtn+'<span class="cat-chevron">▼</span>';
    var det=document.createElement('div');det.className='category-details';
    if(catExp.length===0){
      det.innerHTML='<div class="empty-cat">Nenhum lançamento neste mês</div>';
    }else if(cat.sub.length>0){
      cat.sub.forEach(function(sub){
        var subExp=catExp.filter(function(e){return e.subcategory===sub;});
        if(!subExp.length)return;
        var subTotal=subExp.reduce(function(s,e){return s+e.value;},0);
        var sec=document.createElement('div');sec.className='subcategory-section';
        var html='<div class="subcategory-title">'+sub+'</div>';
        subExp.forEach(function(e){html+=entryHTML(e,false);});
        html+='<div class="sub-total-row"><span>Total '+sub+'</span><span>'+fBRL(subTotal)+'</span></div>';
        sec.innerHTML=html;det.appendChild(sec);
      });
    }else if(cat.id==='gasolina'){
      // gasolina: agrupa por veículo (moto/carro)
      var veiculos=['moto','carro'];
      veiculos.forEach(function(v){
        var vExp=catExp.filter(function(e){return e.subcategory===v;});
        if(!vExp.length)return;
        var vTotal=vExp.reduce(function(s,e){return s+e.value;},0);
        var sec=document.createElement('div');sec.className='subcategory-section';
        var vLabel=v==='moto'?'🏍️ Moto':'🚗 Carro';
        var html='<div class="subcategory-title">'+vLabel+'</div>';
        vExp.forEach(function(e){html+=entryHTML(e,false);});
        html+='<div class="sub-total-row"><span>Total '+vLabel+'</span><span>'+fBRL(vTotal)+'</span></div>';
        sec.innerHTML=html;det.appendChild(sec);
      });
      // entradas sem veículo definido
      var semV=catExp.filter(function(e){return e.subcategory!=='moto'&&e.subcategory!=='carro';});
      semV.forEach(function(e){var d=document.createElement('div');d.innerHTML=entryHTML(e,false);det.appendChild(d.firstChild);});
    }else if(cat.livre||cat.parcela){
      // layout card para weed, outros, alimentação, cartão-terceiros
      catExp.forEach(function(e){var d=document.createElement('div');d.innerHTML=entryHTML(e,true);det.appendChild(d.firstChild);});
      var total=catExp.reduce(function(s,e){return s+e.value;},0);
      if(catExp.length>1){var tr=document.createElement('div');tr.className='sub-total-row';tr.innerHTML='<span>Total</span><span>'+fBRL(total)+'</span>';det.appendChild(tr);}
    }else{
      catExp.forEach(function(e){var d=document.createElement('div');d.innerHTML=entryHTML(e,false);det.appendChild(d.firstChild);});
    }
    item.appendChild(hdr);item.appendChild(det);list.appendChild(item);
  });
  var btnH=document.getElementById('btnManageHidden');
  if(hiddenCats.length>0){
    btnH.style.display='block';
    btnH.textContent=showingHidden?'🙈 Ocultar lista ('+hiddenCats.length+' oculta'+(hiddenCats.length>1?'s':'')+')'
      :'👁 Gerenciar categorias ocultas ('+hiddenCats.length+')';
  }else{btnH.style.display='none';showingHidden=false;}
}

function entryHTML(e, useCardLayout){
  var typeClass=e.type==='card'?'type-card':'type-debit';
  var typeLabel=e.type==='card'?'Crédito':'Débito';
  var actions='<button class="btn-edit-entry" onclick="openEditModal('+e.id+')">✏️</button><button class="btn-del" onclick="deleteExpense('+e.id+')">✕</button>';

  if(useCardLayout){
    // layout card para weed, outros, alimentação, cartão-terceiros
    var name=e.subcategory||'—';
    var extra='';
    if(e.parcela) extra='<span class="entry-card-parcela">'+e.parcela+'</span>';
    if(e.gasLitro) extra='<span class="entry-card-extra">⛽ R$'+e.gasLitro.toFixed(2).replace('.',',')+'/L</span>';
    return '<div class="entry-card">'+
      '<div class="entry-card-top">'+
        '<span class="entry-card-name">'+name+'</span>'+
        '<span class="entry-card-value">'+fBRL(e.value)+'</span>'+
      '</div>'+
      '<div class="entry-card-bottom">'+
        '<span class="entry-card-date">'+fDate(e.date)+'</span>'+
        extra+
        '<span class="entry-card-type '+typeClass+'">'+typeLabel+'</span>'+
        '<span class="entry-card-actions">'+actions+'</span>'+
      '</div>'+
    '</div>';
  }

  // layout linha padrão (subcategorias fixas, gasolina com veículo)
  var extra='';
  if(e.gasLitro) extra='<span class="entry-desc">⛽ R$'+e.gasLitro.toFixed(2).replace('.',',')+'/L</span>';
  return '<div class="expense-entry">'+
    '<span class="entry-date">'+fDate(e.date)+'</span>'+
    extra+
    (e.parcela?'<span class="entry-parcela">'+e.parcela+'</span>':'')+
    '<span class="entry-type '+typeClass+'">'+typeLabel+'</span>'+
    '<span class="entry-value">'+fBRL(e.value)+'</span>'+
    actions+
    '</div>';
}

  if(!confirm('Deletar?'))return;

  saveLocal();renderResume();

  try { await deleteExpenseFromDB(id); setSyncDot('ok'); } catch(e) { setSyncDot('err'); }
}

// ── EDITAR GASTO ──────────────────────────────────────────────────────────────
function populateEditCats(){
  var sel=document.getElementById('eCat');
  if(sel.options.length>1)return;
  CATEGORIES.forEach(function(c){var o=document.createElement('option');o.value=c.id;o.textContent=c.emoji+' '+c.name;sel.appendChild(o);});
}
function openEditModal(id){
  var exp=expenses.find(function(e){return e.id===id;});
  if(!exp)return;
  editingId=id;populateEditCats();setupMask('eValor');
  document.getElementById('eCat').value=exp.categoryId;
  document.getElementById('eData').value=exp.date;
  document.getElementById('eTipo').value=exp.type;
  document.getElementById('eValor').value=exp.value.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById('eParcela').value=exp.parcela||'';
  onEditCatChange(exp.subcategory);
  document.getElementById('editModal').classList.add('active');
}
function onEditCatChange(existingSub){
  var catId=document.getElementById('eCat').value;
  var cat=CATEGORIES.find(function(c){return c.id===catId;});
  document.getElementById('eFieldSubcat').style.display='none';
  document.getElementById('eFieldSubcatLivre').style.display='none';
  document.getElementById('eFieldParcela').style.display='none';
  if(!cat)return;
  if(cat.sub.length>0){
    var sel=document.getElementById('eSubcat');sel.innerHTML='';
    cat.sub.forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o);});
    if(existingSub)sel.value=existingSub;
    document.getElementById('eFieldSubcat').style.display='flex';
  }else if(cat.livre){document.getElementById('eSubcatLivre').value=existingSub||'';document.getElementById('eFieldSubcatLivre').style.display='flex';}
  if(cat.parcela)document.getElementById('eFieldParcela').style.display='flex';
}
function closeEditModal(){editingId=null;document.getElementById('editModal').classList.remove('active');}
async function saveEdit(){
  var catId=document.getElementById('eCat').value;
  var date=document.getElementById('eData').value;
  var value=parseVal(document.getElementById('eValor').value);
  var tipo=document.getElementById('eTipo').value;
  var cat=CATEGORIES.find(function(c){return c.id===catId;});
  if(!catId||!date||value<=0){alert('Preencha todos os campos.');return;}
  var sub=null;
  if(cat.sub.length>0)sub=document.getElementById('eSubcat').value;
  else if(cat.livre){sub=document.getElementById('eSubcatLivre').value.trim();if(!sub){alert('Adicione descrição.');return;}}
  var parcela=cat.parcela?document.getElementById('eParcela').value.trim():null;
  var updated={id:editingId,categoryId:catId,subcategory:sub,parcela:parcela,date:date,value:value,type:tipo};
  expenses=expenses.map(function(e){return e.id===editingId?updated:e;});
  saveLocal();closeEditModal();renderResume();
  setSyncDot('syncing');
  try { await saveExpenseToDB(updated); setSyncDot('ok'); } catch(e) { setSyncDot('err'); }
}

// ── EDITAR ENTRADA ────────────────────────────────────────────────────────────
function openEditIncomeModal(id){
  var inc=incomes.find(function(e){return e.id===id;});
  if(!inc)return;
  editingIncId=id;setupMask('eIncValor');
  document.getElementById('eIncTipo').value=inc.type;
  document.getElementById('eIncData').value=inc.date;
  document.getElementById('eIncValor').value=inc.value.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById('eIncDesc').value=inc.desc||'';
  document.getElementById('eIncFieldDesc').style.display=inc.type==='outro'?'flex':'none';
  document.getElementById('editIncomeModal').classList.add('active');
}
function onEditIncTipoChange(){document.getElementById('eIncFieldDesc').style.display=document.getElementById('eIncTipo').value==='outro'?'flex':'none';}
function closeEditIncomeModal(){editingIncId=null;document.getElementById('editIncomeModal').classList.remove('active');}
async function saveIncomeEdit(){
  var tipo=document.getElementById('eIncTipo').value;
  var date=document.getElementById('eIncData').value;
  var value=parseVal(document.getElementById('eIncValor').value);
  var desc=tipo==='outro'?document.getElementById('eIncDesc').value.trim():'';
  if(!date||value<=0){alert('Preencha todos os campos.');return;}
  var updated={id:editingIncId,type:tipo,date:date,value:value,desc:desc};
  incomes=incomes.map(function(e){return e.id===editingIncId?updated:e;});
  saveLocal();closeEditIncomeModal();renderEntradas();renderResume();
  setSyncDot('syncing');
  try { await saveIncomeToDB(updated); setSyncDot('ok'); } catch(e) { setSyncDot('err'); }
}

// ── ENTRADAS ──────────────────────────────────────────────────────────────────
function renderEntradas(){
  var key=monthKey();
  var inc=incomes.filter(function(e){return e.date.startsWith(key);});
  var list=document.getElementById('incomeList');list.innerHTML='';
  if(!inc.length){list.innerHTML='<div style="text-align:center;color:var(--muted2);font-size:13px;padding:20px">Nenhuma entrada neste mês</div>';return;}
  INCOME_TYPES.forEach(function(itype){
    var items=inc.filter(function(e){return e.type===itype.id;});
    if(!items.length)return;
    var total=items.reduce(function(s,e){return s+e.value;},0);
    var block=document.createElement('div');block.className='income-item';
    var hdr=document.createElement('div');hdr.className='income-item-header';
    hdr.innerHTML='<span class="income-emoji">'+itype.emoji+'</span><span class="income-name">'+itype.name+'</span><span class="income-total">'+fBRL(total)+'</span><span class="income-chevron">▼</span>';
    hdr.onclick=function(){block.classList.toggle('open');};
    var det=document.createElement('div');det.className='income-details';
    items.forEach(function(e){
      det.innerHTML+='<div class="income-entry"><span class="income-entry-date">'+fDate(e.date)+'</span>'+(e.desc?'<span class="income-entry-desc">'+e.desc+'</span>':'')+
        '<span class="income-entry-value">'+fBRL(e.value)+'</span>'+
        '<button class="btn-edit-entry" onclick="openEditIncomeModal('+e.id+')">✏️</button>'+
        '<button class="btn-del" onclick="deleteEntrada('+e.id+')">✕</button></div>';
    });
    block.appendChild(hdr);block.appendChild(det);list.appendChild(block);
  });
}

// ── ANUAL ─────────────────────────────────────────────────────────────────────
function renderAnual(){
  document.getElementById('annualYearLabel').textContent=annualYear;
  var allExp=expenses.filter(function(e){return e.date.startsWith(annualYear+'-');});
  var allInc=incomes.filter(function(e){return e.date.startsWith(annualYear+'-');});
  var table=document.getElementById('annualTable');table.innerHTML='';
  var thead=document.createElement('thead');var hrow=document.createElement('tr');
  var th0=document.createElement('th');th0.textContent='';hrow.appendChild(th0);
  for(var m=0;m<12;m++){var th=document.createElement('th');th.textContent=MONTH_SHORT[m];hrow.appendChild(th);}
  var thT=document.createElement('th');thT.textContent='Total';hrow.appendChild(thT);
  thead.appendChild(hrow);table.appendChild(thead);
  var tbody=document.createElement('tbody');
  var divG=document.createElement('tr');divG.className='div-row';var tdG=document.createElement('td');tdG.colSpan=14;tdG.textContent='Gastos';divG.appendChild(tdG);tbody.appendChild(divG);
  CATEGORIES.forEach(function(cat){
    var tr=document.createElement('tr');var td0=document.createElement('td');td0.textContent=cat.emoji+' '+cat.name;tr.appendChild(td0);
    var rt=0;
    for(var m=0;m<12;m++){var mk=annualYear+'-'+String(m+1).padStart(2,'0');var v=allExp.filter(function(e){return e.categoryId===cat.id&&e.date.startsWith(mk);}).reduce(function(s,e){return s+e.value;},0);rt+=v;var td=document.createElement('td');td.textContent=v>0?fBRL(v):'—';if(v>0)td.className='has-val';tr.appendChild(td);}
    var tdT=document.createElement('td');tdT.textContent=rt>0?fBRL(rt):'—';if(rt>0)tdT.className='has-val';tr.appendChild(tdT);tbody.appendChild(tr);
  });
  var trTG=document.createElement('tr');trTG.className='tot-row';var tTG0=document.createElement('td');tTG0.textContent='Total gastos';trTG.appendChild(tTG0);
  var gG=0;for(var m=0;m<12;m++){var mk=annualYear+'-'+String(m+1).padStart(2,'0');var v=allExp.filter(function(e){return e.date.startsWith(mk);}).reduce(function(s,e){return s+e.value;},0);gG+=v;var td=document.createElement('td');td.textContent=v>0?fBRL(v):'—';if(v>0)td.className='has-val';trTG.appendChild(td);}
  var tGT=document.createElement('td');tGT.textContent=fBRL(gG);tGT.className='has-val';trTG.appendChild(tGT);tbody.appendChild(trTG);
  var divE=document.createElement('tr');divE.className='div-row';var tdE=document.createElement('td');tdE.colSpan=14;tdE.textContent='Entradas';divE.appendChild(tdE);tbody.appendChild(divE);
  INCOME_TYPES.forEach(function(itype){
    var tr=document.createElement('tr');tr.className='income-row';var td0=document.createElement('td');td0.textContent=itype.emoji+' '+itype.name;tr.appendChild(td0);
    var rt=0;for(var m=0;m<12;m++){var mk=annualYear+'-'+String(m+1).padStart(2,'0');var v=allInc.filter(function(e){return e.type===itype.id&&e.date.startsWith(mk);}).reduce(function(s,e){return s+e.value;},0);rt+=v;var td=document.createElement('td');td.textContent=v>0?fBRL(v):'—';if(v>0)td.className='inc-val';tr.appendChild(td);}
    var tdT=document.createElement('td');tdT.textContent=rt>0?fBRL(rt):'—';if(rt>0)tdT.className='inc-val';tr.appendChild(tdT);tbody.appendChild(tr);
  });
  var trTE=document.createElement('tr');trTE.className='tot-row';var tTE0=document.createElement('td');tTE0.textContent='Total entradas';trTE.appendChild(tTE0);
  var gE=0;for(var m=0;m<12;m++){var mk=annualYear+'-'+String(m+1).padStart(2,'0');var v=allInc.filter(function(e){return e.date.startsWith(mk);}).reduce(function(s,e){return s+e.value;},0);gE+=v;var td=document.createElement('td');td.textContent=v>0?fBRL(v):'—';if(v>0)td.className='inc-val';trTE.appendChild(td);}
  var tET=document.createElement('td');tET.textContent=fBRL(gE);tET.className='inc-val';trTE.appendChild(tET);tbody.appendChild(trTE);
  var trS=document.createElement('tr');trS.className='saldo-row';var tS0=document.createElement('td');tS0.textContent='Saldo';trS.appendChild(tS0);
  var gS=0;for(var m=0;m<12;m++){var mk=annualYear+'-'+String(m+1).padStart(2,'0');var vG=allExp.filter(function(e){return e.date.startsWith(mk);}).reduce(function(s,e){return s+e.value;},0);var vE=allInc.filter(function(e){return e.date.startsWith(mk);}).reduce(function(s,e){return s+e.value;},0);var s=vE-vG;gS+=s;var td=document.createElement('td');td.textContent=fBRL(s);td.className=s>=0?'pos':'neg';trS.appendChild(td);}
  var tST=document.createElement('td');tST.textContent=fBRL(gS);tST.className=gS>=0?'pos':'neg';trS.appendChild(tST);tbody.appendChild(trS);
  table.appendChild(tbody);
}

// ── EXPORT/IMPORT ─────────────────────────────────────────────────────────────
function exportData(){
  var blob=new Blob([JSON.stringify({expenses:expenses,incomes:incomes},null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='controle_'+new Date().toISOString().split('T')[0]+'.json';a.click();URL.revokeObjectURL(url);
}
function openImportModal(){document.getElementById('importModal').classList.add('active');}
function closeImportModal(){document.getElementById('importModal').classList.remove('active');}
async function importData(){
  var file=document.getElementById('importFile').files[0];
  if(!file){alert('Selecione um arquivo');return;}
  var reader=new FileReader();
  reader.onload=async function(ev){
    try{
      var d=JSON.parse(ev.target.result);
      var exps=Array.isArray(d)?d:(d.expenses||[]);
      var incs=d.incomes||[];
      expenses=exps;incomes=incs;
      saveLocal();closeImportModal();renderResume();renderEntradas();
      setSyncDot('syncing');
      for(var i=0;i<exps.length;i++) await saveExpenseToDB(exps[i]);
      for(var i=0;i<incs.length;i++) await saveIncomeToDB(incs[i]);
      setSyncDot('ok');
      alert('Importado e sincronizado!');
    }catch(err){alert('Erro: '+err.message);}
  };
  reader.readAsText(file);
}
</script>
